name: CI/CD Pipeline - FormFlow App

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
      - main

env:
  DOCKER_USERNAME: fuja9182
  BACKEND_IMAGE: fuja9182/formflow-backend
  FRONTEND_IMAGE: fuja9182/formflow-frontend

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "IMAGE_TAG=v-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            -f backend/Dockerfile \
            ./backend

      - name: Push backend image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "IMAGE_TAG=v-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            -f frontend/Dockerfile \
            ./frontend

      - name: Push frontend image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "IMAGE_TAG=v-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p ~/formflow
            cd ~/formflow

            cat > docker-compose.yml << COMPOSE
            version: "3.9"
            services:
              postgres:
                image: postgres:16-alpine
                container_name: expense-db
                restart: unless-stopped
                environment:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  POSTGRES_DB: expense_db
                ports:
                  - "5432:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                networks:
                  - expense-network
              backend:
                image: fuja9182/formflow-backend:${{ steps.tag.outputs.IMAGE_TAG }}
                container_name: expense-backend
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                environment:
                  NODE_ENV: production
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  PORT: 5000
                ports:
                  - "5000:5000"
                networks:
                  - expense-network
              frontend:
                image: fuja9182/formflow-frontend:${{ steps.tag.outputs.IMAGE_TAG }}
                container_name: expense-frontend
                restart: unless-stopped
                depends_on:
                  - backend
                environment:
                  NEXT_PUBLIC_API_URL: http://${{ secrets.VM_HOST }}:5000
                ports:
                  - "80:3000"
                networks:
                  - expense-network
            volumes:
              postgres_data:
            networks:
              expense-network:
                driver: bridge
            COMPOSE

            docker pull fuja9182/formflow-backend:${{ steps.tag.outputs.IMAGE_TAG }}
            docker pull fuja9182/formflow-frontend:${{ steps.tag.outputs.IMAGE_TAG }}
            docker compose down
            docker compose up -d
            sleep 15
            docker compose ps
            echo "=== Deployed version: ${{ steps.tag.outputs.IMAGE_TAG }} ==="
